<!doctype html>
<html lang="{{ lang or 'en' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ tr('login.title') }}</title>
    <link rel="stylesheet" href="/static/clean.css">
</head>
<body>
<canvas id="matrix"></canvas>
<main class="auth">
    <section class="card auth-card">
        <div class="mark big">DTG</div>
        <h1>{{ tr('login.heading') }}</h1>
        <p>{{ tr('login.intro') }}</p>
        {% if error %}<div class="toast bad">{{ error }}</div>{% endif %}
        <div class="stack">
            <div class="toast ok">{{ tr('login.note') }}</div>
            <a class="btn ghost" href="/">{{ tr('login.submit') }}</a>
        </div>
    </section>
</main>
<script src="/static/matrix.js"></script>
</body>
</html>
